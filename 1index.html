<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />

    <meta name="robots" content="INDEX,FOLLOW" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #0d1117;
        color: #fff;
        font-family: "Segoe UI", Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }

      .container {
        max-width: 600px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
        animation: glow 2s infinite alternate;
      }

      @keyframes glow {
        from {
          box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
        }
        to {
          box-shadow: 0 0 35px rgba(255, 0, 0, 0.6);
        }
      }

      h1 {
        font-size: 48px;
        margin-bottom: 10px;
        font-weight: 700;
        color: #ff4d4d;
      }

      p {
        font-size: 18px;
        opacity: 0.9;
        margin-bottom: 25px;
        line-height: 1.6;
      }

      .code-box {
        background: rgba(255, 0, 0, 0.15);
        border-left: 4px solid #ff4d4d;
        padding: 15px;
        margin-bottom: 25px;
        font-family: monospace;
        text-align: left;
        font-size: 15px;
        border-radius: 8px;
        color: #ffb3b3;
      }

      .btn {
        display: inline-block;
        padding: 12px 25px;
        background: #ff4d4d;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        transition: 0.3s;
      }

      .btn:hover {
        background: #e60000;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>500</h1>
      <p>Internal Server Error</p>

      <div class="code-box">
        ⚠️ The server encountered an unexpected condition that prevented it from
        fulfilling the request.
        <br /><br />
      </div>

      <!-- <a href="/" class="btn">Retry</a> -->
    </div>
  </body>
</html>
